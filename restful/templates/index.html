<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mutual request</title>
</head>

<body>
    <h1>Mutual requesto</h1>
    <p>Enter the required data</p>

    <form action="/predict" method="POST">
        <label for="gender">● Gender:</label>
        <select name="gender" id="gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select><br><br>

        <label for="married">● Marital status:</label>
        <select name="married" id="married">
            <option value="No">Not married</option>
            <option value="Yes">Married</option>
        </select><br><br>

        <label for="dependents">● Number of children:</label>
        <select name="dependents" id="dependents">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3+">3+</option>
        </select><br><br>

        <label for="education">● Education:</label>
        <select name="education" id="education">
            <option value="Graduate">Graduate</option>
            <option value="Not Graduate">Not Graduate</option>
        </select><br><br>

        <label for="self_employed">● Self-employment:</label>
        <select name="self_employed" id="self_employed">
            <option value="No">No</option>
            <option value="Yes">Yes</option>
        </select><br><br>

        <label for="applicant_income">● Applicant's income:</label>
        <input type="number" name="applicant_income" id="applicant_income" required value="5000"><br><br>

        <label for="coapplicant_income">● Co-applicant's income:</label>
        <input type="number" name="coapplicant_income" id="coapplicant_income" required value="0"><br><br>

        <label for="loan_amount">● Mortgage amount:</label>
        <input type="number" name="loan_amount" id="loan_amount" required value="120"><br><br>

        <label for="loan_amount_term">● Mortgage term:</label>
        <input type="number" name="loan_amount_term" id="loan_amount_term" required value="360"><br><br>

        <label for="credit_history">● Credit history:</label>
        <select name="credit_history" id="credit_history">
            <option value="1.0">Yes (No outstanding debt)</option>
            <option value="0.0">No (Past defaults)</option>
        </select><br><br>

        <label for="property_area">● Geographic area:</label>
        <select name="property_area" id="property_area">
            <option value="Urban">Urban</option>
            <option value="Semiurban">Semi-urban</option>
            <option value="Rural">Rural</option>
        </select><br><br>

        <button type="submit">Send Request</button>
    </form>
</body>

</html>
